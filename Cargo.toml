[workspace]
resolver = "3"
members = ["crates/vault", "crates/engine", "crates/test-support", "src-tauri"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/iyulab/openquote-care"
rust-version = "1.90"

[workspace.dependencies]
tauri-kit-diagnostics = "0.14.0"
tauri-kit-fs = "0.14.0"
tauri-kit-sidecar = "0.14.0"
tauri-kit-watch = "0.14.0"
tauri-kit-webview = "0.14.0"

# The vault key is wrapped with scrypt at a fixed cost; unoptimized, one unlock takes minutes, so
# development builds optimize the password-hashing crates the way release builds do.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
