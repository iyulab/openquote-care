[package]
name = "openquote-care-engine"
version = "0.1.0"
description = "Runs the Openquote engine sidecar for the desktop shell and moves vault files between it and the encrypted vault."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.23"
openquote-care-vault = { path = "../vault" }
serde_json = "1"
tauri-kit-sidecar = { workspace = true, features = ["loopback", "loopback-client"] }

[dev-dependencies]
openquote-care-test-support = { path = "../test-support" }
age = "0.12"
tempfile = "3"
