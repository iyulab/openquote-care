[package]
name = "openquote-care-engine"
version = "0.1.0"
description = "Runs the Openquote engine sidecar for the desktop shell and moves vault files between it and the encrypted vault."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.22"
getrandom = "0.3"
openquote-care-vault = { path = "../vault" }
serde_json = "1"
tauri-kit-sidecar = { git = "https://github.com/iyulab/tauri-kit", tag = "v0.5.0" }
ureq = { version = "3", default-features = false, features = ["json"] }

[dev-dependencies]
openquote-care-test-support = { path = "../test-support" }
age = "0.12"
tempfile = "3"
