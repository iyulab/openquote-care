[package]
name = "openquote-care"
version = "0.13.1"
description = "Counselling records that stay yours, and monthly reports that survive a change of categories"
authors = ["iyulab"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# A distinct lib name avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "openquote_care_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
openquote-care-engine = { path = "../crates/engine" }
openquote-care-vault = { path = "../crates/vault" }
age = "0.12"
tauri-kit-diagnostics = { workspace = true, features = ["appinsights"] }
tauri-kit-webview.workspace = true
# The app's local data folder before Tauri starts, resolved as Tauri resolves it.
dirs = "7"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
openquote-care-test-support = { path = "../crates/test-support" }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# The person's display languages.
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
