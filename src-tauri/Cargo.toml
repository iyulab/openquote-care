[package]
name = "openquote-care"
version = "0.1.1"
description = "Counselling records that stay yours, and monthly reports that survive a change of categories"
authors = ["iyulab"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# A distinct lib name avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "openquote_care_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
openquote-care-engine = { path = "../crates/engine" }
openquote-care-vault = { path = "../crates/vault" }
age = "0.12"
# The same client the engine crate uses, with TLS from the operating system for diagnostics.
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# The web view's own interfaces, at the versions Tauri's runtime uses, to clear what it remembered.
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
