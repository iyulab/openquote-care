name: Release

# Builds the signed Windows installers and attaches them to a draft release.
# Run by hand after the full local verification (tests, window e2e, installed-app check) passes.
#
# The build runs here, without the signing credential. Signing, bundling, the installed-copy check, the
# updater signature and latest.json are iyulab/tauri-release's reusable Windows workflow (pinned to a
# commit): it signs exactly the two built executables, bundles twice so the uninstaller and the NSIS
# plugins are signed too, signs the installer and checks every installed file's signature. Only its
# signing jobs hold the signing credential — they are iyulab/code-sign's reusable workflow, which runs
# nothing of this repository.
#
#   ci → build (no credential) → offline: the installer with WebView2 inside, signed and checked
#      → release: the standard installer, signed and checked, its updater signature and latest.json,
#        and the draft → offline-assets: the offline installer added to the draft
#
# The offline installer goes first so the draft is made only once both installers passed; the two calls
# run one after another because tauri-release's intermediate artifacts share names.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Exactly the files the installer carries that we build, relative to the repository root — the signing
  # job refuses an artifact holding any other set.
  SIGN_FILES: |
    target/release/openquote-care.exe
    sidecar/publish/openquote-care-sidecar.exe

jobs:
  # The commit being released passed CI: a test that fails only sometimes, or a check that only CI
  # runs, must not let a build go out from a red commit. Waits for a CI run still going.
  ci:
    name: CI passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
    steps:
      - name: Wait for the CI run of this commit and require success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            url="repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&per_page=1"
            run=$(gh api "$url" --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
            if [ -z "$run" ]; then echo "No CI run for ${{ github.sha }} yet"; sleep 30; continue; fi
            set -- $run
            if [ "$1" != "completed" ]; then echo "CI is $1: $3"; sleep 30; continue; fi
            if [ "$2" = "success" ]; then echo "CI passed: $3"; exit 0; fi
            echo "::error::CI for this commit concluded $2 — $3"; exit 1
          done
          echo "::error::No finished CI run for ${{ github.sha }} after 18 minutes"; exit 1

  build:
    needs: ci
    # Windows runner: the shell and the ahead-of-time compiled engine sidecar are Windows binaries.
    runs-on: windows-latest
    # Only for the diagnostics connection the build embeds (an environment secret). No id-token: this job
    # cannot sign.
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versions.outputs.app }}
      sign-files: ${{ steps.versions.outputs.sign-files }}
      updater-pubkey: ${{ steps.versions.outputs.updater-pubkey }}
      tauri-cli: ${{ steps.versions.outputs.tauri-cli }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read versions
        id: versions
        shell: pwsh
        run: |
          $app = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $engine = ([xml](Get-Content Directory.Packages.props -Raw)).Project.ItemGroup.PackageVersion |
            Where-Object { $_.Include -eq 'Openquote' } | Select-Object -ExpandProperty Version
          $pubkey = (Get-Content src-tauri/tauri.updater.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          # The bundler runs the very CLI this repository builds with.
          # The lock file keys its own package by an empty name, which only a hash table reads.
          $cli = (Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable).packages['node_modules/@tauri-apps/cli'].version
          if (-not $app -or -not $engine -or -not $pubkey -or -not $cli) { throw "Could not read the app or engine version, the updater key or the Tauri CLI" }
          "app=$app" >> $env:GITHUB_OUTPUT
          "engine=$engine" >> $env:GITHUB_OUTPUT
          "updater-pubkey=$pubkey" >> $env:GITHUB_OUTPUT
          "tauri-cli=@tauri-apps/cli@$cli" >> $env:GITHUB_OUTPUT
          # The signing workflow is called with `with:`, which cannot read `env` — hand it the list as an output.
          "sign-files<<EOF" >> $env:GITHUB_OUTPUT
          @($env:SIGN_FILES -split "`n" | ForEach-Object Trim | Where-Object { $_ }) >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      # The sidecar restores the engine from nuget.org: the installer carries the very package that was
      # published and tested against, at the version Directory.Packages.props names.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - run: npm ci

      - name: Check every file names the same app version
        run: node scripts/check-versions.mjs

      # The screens build (`npm run build`, run by `tauri build`) bundles without type-checking.
      - name: Type-check the screens
        run: npm run typecheck

      - name: Publish the engine sidecar
        run: npm run publish:sidecar

      # The installer ships these notices, so they are written from what this build ships: the
      # sidecar is compiled with the newest .NET patch here (global.json rolls forward), whose
      # runtime packs the committed file, written on a development machine, may not name. Strict:
      # a shipped package without a license text fails the release.
      - name: Write the third-party notices for what this build ships
        run: npm run notices

      # The release notes may name the .NET runtime the engine is built on (a security update, say): the run's
      # summary says which one it was, read from the notices just written from what this build ships.
      - name: Name the .NET runtime the engine sidecar is built on
        shell: pwsh
        run: |
          $pack = Select-String -Path LICENSES/THIRD-PARTY-NOTICES.txt -Pattern '^Microsoft\.NETCore\.App\.Runtime\.NativeAOT\.win-x64 (\S+)$' | Select-Object -First 1
          if (-not $pack) { throw 'The notices name no Native AOT runtime pack for the engine sidecar.' }
          $version = $pack.Matches[0].Groups[1].Value
          Write-Output "The engine sidecar is built on the .NET runtime $version."
          "The engine sidecar is built on the .NET runtime **$version**." >> $env:GITHUB_STEP_SUMMARY

      # Built, not bundled: tauri-release bundles from the signed files. The updater overlay is part of the
      # build (the app carries its public key and where to look); its artifacts are made after signing.
      - name: Build the app
        env:
          # Error diagnostics are embedded only in this build (see docs/architecture.md).
          OPENQUOTE_DIAGNOSTICS_CONNECTION: ${{ secrets.OPENQUOTE_DIAGNOSTICS_CONNECTION }}
          # Feedback: the records service's public key (public by design, so a variable). Without
          # it the installer offers no feedback (see docs/privacy.md).
          OPENQUOTE_FEEDBACK_KEY: ${{ vars.OPENQUOTE_FEEDBACK_KEY }}
        run: npx tauri build --no-bundle --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.updater.conf.json

      # Error diagnostics are on only when the build embedded the collector's connection string; a missing
      # secret would leave every installation silent, with nothing to say so. Embedded is not enough: a
      # malformed or wrong value is embedded just as silently. One check report (version `<app>-check`, no
      # content) must be taken by the collector the app sends to.
      - name: Check the diagnostics connection the app embeds
        shell: pwsh
        env:
          OPENQUOTE_DIAGNOSTICS_CONNECTION: ${{ secrets.OPENQUOTE_DIAGNOSTICS_CONNECTION }}
        run: |
          $app = [IO.File]::ReadAllBytes('target/release/openquote-care.exe')
          if ([Text.Encoding]::ASCII.GetString($app).IndexOf('IngestionEndpoint=') -lt 0) { throw 'the app does not embed the error diagnostics connection' }
          node scripts/check-diagnostics-connection.mjs ${{ steps.versions.outputs.app }}
          if ($LASTEXITCODE -ne 0) { throw 'the collector does not take reports over the embedded connection' }

      # The notes are this version's section of CHANGELOG.md.
      - name: Read the release notes
        id: notes
        shell: pwsh
        run: |
          $notes = node scripts/release-notes.mjs ${{ steps.versions.outputs.app }} ${{ steps.versions.outputs.engine }}
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md has no notes for ${{ steps.versions.outputs.app }}" }
          $end = "NOTES_$([guid]::NewGuid().ToString('N'))"
          "notes<<$end" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          $end >> $env:GITHUB_OUTPUT

      # The signing job gets exactly the files to sign; bundling gets the tracked sources, the built app and
      # what the build wrote that the installer carries (the sidecar, the notices).
      - name: Stage for signing and bundling
        shell: pwsh
        run: |
          $files = @($env:SIGN_FILES -split "`n" | ForEach-Object Trim | Where-Object { $_ })
          $unsigned = Join-Path $env:RUNNER_TEMP 'unsigned-binaries'
          foreach ($f in $files) {
            $to = Join-Path $unsigned $f
            New-Item -ItemType Directory -Force (Split-Path $to) | Out-Null
            Copy-Item $f $to
          }
          $bundleIn = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'bundle-input')
          $tar = Join-Path $env:RUNNER_TEMP 'sources.tar'
          git archive --format=tar -o $tar HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          tar -xf $tar -C $bundleIn
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          foreach ($f in $files) {
            $to = Join-Path $bundleIn $f
            New-Item -ItemType Directory -Force (Split-Path $to) | Out-Null
            Copy-Item $f $to
          }
          Copy-Item LICENSES/* (Join-Path $bundleIn 'LICENSES') -Force

      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-binaries
          path: ${{ runner.temp }}/unsigned-binaries
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-input
          path: ${{ runner.temp }}/bundle-input
          if-no-files-found: error
          retention-days: 1

  # The same signed app, with the WebView2 installer inside (about 200 MB more), for computers that have
  # no WebView2 runtime and no internet connection.
  offline:
    needs: build
    uses: iyulab/tauri-release/.github/workflows/windows.yml@50e2039d1ba7bd8c371de6ca56dd3be51d95a546 # main, 2026-10-19
    # A called workflow's jobs get no more than this, and a run with a job asking for more does not start: its
    # draft job asks for contents: write even when it does not run.
    permissions:
      id-token: write      # its three signing jobs
      contents: write      # its draft job (not run here) — and contents: read for the signing jobs
    with:
      unsigned-artifact: unsigned-binaries
      files: ${{ needs.build.outputs.sign-files }}
      bundle-artifact: bundle-input
      app-dir: .
      tauri-cli: ${{ needs.build.outputs.tauri-cli }}
      node-version: '22'
      config: |
        src-tauri/tauri.bundle.conf.json
        src-tauri/tauri.updater.conf.json
        src-tauri/tauri.offline.conf.json
      description: Openquote Care
      description-url: https://openquote.me
      installer-artifact: signed-offline-installer

  release:
    needs: [build, offline]
    uses: iyulab/tauri-release/.github/workflows/windows.yml@50e2039d1ba7bd8c371de6ca56dd3be51d95a546 # main, 2026-10-19
    permissions:
      id-token: write      # its three signing jobs
      contents: write      # its draft job
    with:
      unsigned-artifact: unsigned-binaries
      files: ${{ needs.build.outputs.sign-files }}
      bundle-artifact: bundle-input
      app-dir: .
      tauri-cli: ${{ needs.build.outputs.tauri-cli }}
      node-version: '22'
      config: |
        src-tauri/tauri.bundle.conf.json
        src-tauri/tauri.updater.conf.json
      description: Openquote Care
      description-url: https://openquote.me
      draft: true
      tag: v${{ needs.build.outputs.version }}
      title: Openquote Care v${{ needs.build.outputs.version }}
      notes: ${{ needs.build.outputs.notes }}
      # The newest is always at the same address: the website links it through releases/latest/download/.
      alias: Openquote.Care_x64-setup.exe
      # What an installed app reads to find a newer version (latest.json) and the installer's updater signature.
      updater: true
      version: ${{ needs.build.outputs.version }}
      updater-pubkey: ${{ needs.build.outputs.updater-pubkey }}
      updater-environment: production
    secrets:
      updater-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      updater-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  offline-assets:
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: signed-offline-installer
          path: offline
      - name: Add the offline installer to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=(offline/*_x64-setup.exe)
          [ "${#found[@]}" -eq 1 ] || { echo "expected one offline installer, found ${#found[@]}" >&2; exit 1; }
          installer="${found[0]}"
          size=$(stat -c %s "$installer")
          # The WebView2 installer is about 200 MB: a smaller file has not got it inside.
          [ "$size" -ge $((100 * 1024 * 1024)) ] || { echo "the offline installer is $size bytes — the WebView2 installer is not inside" >&2; exit 1; }
          name="$(basename "$installer")"
          mkdir out
          cp "$installer" "out/${name%_x64-setup.exe}_x64-offline-setup.exe"
          # The newest is always at the same address, like the standard installer's alias.
          cp "$installer" out/Openquote.Care_x64-offline-setup.exe
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY"
