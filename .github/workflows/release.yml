name: Release

# Builds the signed Windows installer and attaches it to a draft release.
# Run by hand after the full local verification (tests, window e2e, installed-app check) passes;
# this workflow only builds, signs and checks the signatures.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Windows runner: the installer, the shell and the ahead-of-time compiled engine sidecar are
    # Windows binaries, and Authenticode signing runs on Windows.
    runs-on: windows-latest
    # The signing credential is federated to this environment.
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Read versions
        id: versions
        shell: pwsh
        run: |
          $app = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $engine = ([xml](Get-Content Directory.Packages.props -Raw)).Project.ItemGroup.PackageVersion |
            Where-Object { $_.Include -eq 'Openquote' } | Select-Object -ExpandProperty Version
          if (-not $app -or -not $engine) { throw "Could not read the app or engine version" }
          "app=$app" >> $env:GITHUB_OUTPUT
          "engine=$engine" >> $env:GITHUB_OUTPUT

      # The sidecar restores the engine from nuget.org: the installer carries the very package that was
      # published and tested against, at the version Directory.Packages.props names.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Pinned to a commit like every third-party action in this job: it holds the signing token.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - run: npm ci

      - name: Check every file names the same app version
        run: node scripts/check-versions.mjs

      # The screens build (`npm run build`, run by `tauri build`) bundles without type-checking.
      - name: Type-check the screens
        run: npm run typecheck

      - name: Publish the engine sidecar
        run: npm run publish:sidecar

      # The installer ships these notices, so they are written from what this build ships: the
      # sidecar is compiled with the newest .NET patch here (global.json rolls forward), whose
      # runtime packs the committed file, written on a development machine, may not name. Strict:
      # a shipped package without a license text fails the release.
      - name: Write the third-party notices for what this build ships
        run: npm run notices

      # The sidecar ships as a bundle resource, which Tauri does not sign, so it is signed here.
      - name: Sign the engine sidecar
        # Pinned to a commit: this job holds an OIDC token that can sign as iyulab.
        uses: iyulab/code-sign@693f7261b2e4aef517ff8972db7d07eb53ffc623 # main, 2026-09-30
        with:
          files: sidecar/publish/openquote-care-sidecar.exe

      - name: Acquire a Key Vault access token
        shell: pwsh
        run: |
          $token = az account get-access-token --resource https://vault.azure.net --query accessToken -o tsv
          if (-not $token) { throw "Failed to acquire a Key Vault access token" }
          echo "::add-mask::$token"
          "AZURE_KV_TOKEN=$token" >> $env:GITHUB_ENV

      - name: Build and sign the installer
        env:
          AZURE_KV_URL: https://kv-codesign-iyulab.vault.azure.net/
          AZURE_KV_CERT: globalsign-ev-codesign
          AZURE_TIMESTAMP_URL: http://timestamp.globalsign.com/tsa/r6advanced1
          # Error diagnostics are embedded only in this build (see docs/architecture.md).
          OPENQUOTE_DIAGNOSTICS_CONNECTION: ${{ secrets.OPENQUOTE_DIAGNOSTICS_CONNECTION }}
          # The updater's key: only this build carries the public half and looks for new versions,
          # and its installer gets an updater signature, made after the Authenticode signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.sign.conf.json --config src-tauri/tauri.updater.conf.json

      # Tauri signs the app it puts in the installer and then restores the unsigned build output,
      # so the signatures are checked on an installed copy.
      - name: Check signatures and diagnostics
        id: installer
        shell: pwsh
        env:
          OPENQUOTE_DIAGNOSTICS_CONNECTION: ${{ secrets.OPENQUOTE_DIAGNOSTICS_CONNECTION }}
        run: |
          $installer = Get-Item "target/release/bundle/nsis/*_${{ steps.versions.outputs.app }}_x64-setup.exe"
          $target = Join-Path $env:RUNNER_TEMP 'installed'
          # NSIS: /S is silent, /D= must come last and unquoted.
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "The installer exited with $($process.ExitCode)" }
          $files = @($installer.FullName, (Join-Path $target 'openquote-care.exe'), (Join-Path $target 'sidecar/openquote-care-sidecar.exe'))
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "$file is not validly signed: $($signature.Status)" }
            Write-Host "$file — $($signature.SignerCertificate.Subject)"
          }
          # Error diagnostics are on only when the build embedded the collector's connection string; a
          # missing secret would leave every installation silent, with nothing to say so.
          $app = [IO.File]::ReadAllBytes((Join-Path $target 'openquote-care.exe'))
          if ([Text.Encoding]::ASCII.GetString($app).IndexOf('IngestionEndpoint=') -lt 0) { throw 'the app does not embed the error diagnostics connection' }
          # Embedded is not enough: a malformed or wrong value is embedded just as silently. One check
          # report (version `<app>-check`, no content) must be taken by the collector the app sends to.
          node scripts/check-diagnostics-connection.mjs ${{ steps.versions.outputs.app }}
          if ($LASTEXITCODE -ne 0) { throw 'the collector does not take reports over the embedded connection' }
          # The updater signature: over the final, Authenticode-signed bytes, and with the key the app carries.
          node scripts/verify-update-signature.mjs $installer.FullName "$($installer.FullName).sig"
          if ($LASTEXITCODE -ne 0) { throw 'the updater signature does not verify' }
          # Moved aside: the offline installer below is written under the same names.
          $out = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'installers')
          $kept = Move-Item $installer.FullName (Join-Path $out $installer.Name) -PassThru
          Move-Item "$($installer.FullName).sig" (Join-Path $out "$($installer.Name).sig")
          "path=$($kept.FullName)" >> $env:GITHUB_OUTPUT

      # The same signed app, with the WebView2 installer inside (about 200 MB more), for computers
      # that have no WebView2 runtime and no internet connection. `tauri bundle` reuses the build.
      - name: Bundle and sign the offline installer
        id: offline
        env:
          AZURE_KV_URL: https://kv-codesign-iyulab.vault.azure.net/
          AZURE_KV_CERT: globalsign-ev-codesign
          AZURE_TIMESTAMP_URL: http://timestamp.globalsign.com/tsa/r6advanced1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          npx tauri bundle --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.sign.conf.json --config src-tauri/tauri.updater.conf.json --config src-tauri/tauri.offline.conf.json
          if ($LASTEXITCODE -ne 0) { throw "tauri bundle exited with $LASTEXITCODE" }
          $installer = Get-Item "target/release/bundle/nsis/*_${{ steps.versions.outputs.app }}_x64-setup.exe"
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "$($installer.FullName) is not validly signed: $($signature.Status)" }
          if ($installer.Length -lt 100MB) { throw "the offline installer is $($installer.Length) bytes — the WebView2 installer is not inside" }
          $name = $installer.Name -replace '_x64-setup\.exe$', '_x64-offline-setup.exe'
          $kept = Move-Item $installer.FullName (Join-Path $env:RUNNER_TEMP "installers/$name") -PassThru
          "path=$($kept.FullName)" >> $env:GITHUB_OUTPUT

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.versions.outputs.app }}"
          $tag = "v$version"
          $installer = Get-Item "${{ steps.installer.outputs.path }}"
          $offline = Get-Item "${{ steps.offline.outputs.path }}"
          # GitHub names a release asset with its spaces turned into dots.
          $asset = $installer.Name -replace ' ', '.'
          # Names without the version, so the newest is always at the same address (the website links
          # these through releases/latest/download/).
          $latest = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'latest')
          $stable = Copy-Item $installer.FullName (Join-Path $latest 'Openquote.Care_x64-setup.exe') -PassThru
          $stableOffline = Copy-Item $offline.FullName (Join-Path $latest 'Openquote.Care_x64-offline-setup.exe') -PassThru
          # What an installed app reads to find a newer version: this version, the standard installer and its updater signature.
          $description = [ordered]@{
            version = $version
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content "$($installer.FullName).sig" -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/$tag/$asset"
              }
            }
          }
          $json = Join-Path $latest 'latest.json'
          $description | ConvertTo-Json -Depth 5 | Set-Content -Path $json -Encoding utf8NoBOM
          gh release create $tag $installer.FullName $offline.FullName $stable.FullName $stableOffline.FullName $json --draft --target $env:GITHUB_SHA `
            --title "Openquote Care $tag" --notes "Engine ${{ steps.versions.outputs.engine }}."
