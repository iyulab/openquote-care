name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The checks that run on any machine: the UI and the engine sidecar. The shell, the real window and
# the installer need Windows and WebView2 and are checked locally with `npm run verify`.
jobs:
  ui:
    name: typecheck and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:core
      - run: npm run check:tokens
      - run: npm run typecheck
      - run: npm test

  sidecar:
    name: sidecar tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet test --solution OpenquoteCare.slnx
